border:6px solid #E8A317;box-sizing:border-box;background:#14110F url(\"d85e4324-f4b5-4ce9-add2-2147f86cd766\") center/cover no-repeat}\n.toghu-wide{flex:1 1 360px;height:300px;border:6px solid #E8A317;box-sizing:border-box;background:#14110F url(\"d85e4324-f4b5-4ce9-add2-2147f86cd766\") center 30%/cover no-repeat;display:flex;align-items:flex-end}\n.btn{display:inline-block;padding:14px 26px;font-weight:700;text-decoration:none;border:2px solid #E8A317;min-height:20px}\n.card{padding:28px;display:flex;flex-direction:column;gap:12px}\ndetails{border-top:1px solid #8A7A62;padding:18px 0}\nsummary{font-weight:700;font-size:18px;cursor:pointer}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font-family:'DM Sans',sans-serif;background:#14110F;color:#F6EEDD;max-width:1360px;margin:0 auto\" data-canvas-width=\"1360\" data-canvas-height=\"3800\" data-document-role=\"page\" data-label=\"Home page\">\n\n<div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:20px 48px\">\n<div style=\"font-weight:800;font-size:20px\"><span style=\"color:#D12A38\">TEDx<\u002Fspan> University of Bamenda<\u002Fdiv>\n<nav style=\"display:flex;flex-wrap:wrap;gap:20px;font-size:15px\">\n<a href=\"#about\">About<\u002Fa><a href=\"#theme\">Theme<\u002Fa><a href=\"#speakers\">Speakers<\u002Fa><a href=\"#experience\">Experience<\u002Fa><a href=\"#sponsors\">Sponsors<\u002Fa><a href=\"#faq\">FAQ<\u002Fa><a href=\"#contact\">Contact<\u002Fa>\n<\u002Fnav>\n<a class=\"btn\" href=\"#tickets\" style=\"background:#D12A38;border-color:#D12A38;color:#fff\">Get tickets<\u002Fa>\n<\u002Fdiv>\n<div class=\"toghu\"><\u002Fdiv>\n\n<section style=\"display:flex;flex-wrap:wrap;gap:48px;align-items:center;padding:96px 48px\">\n<div style=\"flex:1 1 520px;display:flex;flex-direction:column;gap:24px\">\n<div style=\"color:#E8A317;font-weight:700;letter-spacing:3px;font-size:14px\">[DATE] · [VENUE], BAMENDA<\u002Fdiv>\n<h1 style=\"margin:0;font-family:'Fraunces',serif;font-weight:800;font-size:88px;line-height:1\">Beyond the <span style=\"color:#E8A317\">Applause<\u002Fspan><\u002Fh1>\n<p style=\"margin:0;font-size:20px;line-height:1.6;color:#CBBFA8;max-width:560px\">Ideas worth spreading from the Grassfields. A day of talks, performance and conversation about what remains when the clapping stops.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n<a class=\"btn\" href=\"#tickets\" style=\"background:#D12A38;border-color:#D12A38;color:#fff\">Buy a ticket<\u002Fa>\n<a class=\"btn\" href=\"#tickets\" style=\"color:#E8A317\">Sponsor a ticket<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 320px;display:flex;justify-content:center\" aria-hidden=\"true\">\n<div class=\"toghu-panel\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<div class=\"toghu\"><\u002Fdiv>\n\n<section id=\"about\" style=\"background:#F6EEDD;color:#14110F;padding:80px 48px;display:flex;flex-wrap:wrap;gap:48px\">\n<div style=\"flex:1 1 360px\"><h2 style=\"margin:0;font-family:'Fraunces',serif;font-size:44px\">About the event<\u002Fh2><\u002Fdiv>\n<div style=\"flex:2 1 480px;display:flex;flex-direction:column;gap:16px;font-size:18px;line-height:1.7;color:#3A3128\">\n<p style=\"margin:0\">TEDxUniversity of Bamenda brings students, creators and community leaders together to share ideas that start local and travel far.<\u002Fp>\n<p style=\"margin:0\">This independent TEDx event is operated under license from TED. [ORGANISER STORY AND AUDIENCE SIZE HERE]<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"theme\" style=\"padding:80px 48px;display:flex;flex-wrap:wrap;gap:48px;align-items:center\">\n<div class=\"toghu-wide\"><span style=\"background:#14110F;color:#E8A317;padding:12px 20px;font-family:'Fraunces',serif;font-size:28px;font-weight:800\">Beyond the Applause<\u002Fspan><\u002Fdiv>\n<div style=\"flex:2 1 480px;display:flex;flex-direction:column;gap:16px\">\n<h2 style=\"margin:0;font-family:'Fraunces',serif;font-size:44px;color:#E8A317\">The theme<\u002Fh2>\n<p style=\"margin:0;font-size:18px;line-height:1.7;color:#CBBFA8\">Like Toghu embroidery, every great idea is built stitch by stitch, far from the spotlight. This year we look at the work, the people and the follow-through that come after the applause. [THEME STATEMENT HERE]<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"speakers\" style=\"background:#1F1A16;padding:80px 48px\">\n<h2 style=\"margin:0 0 40px;font-family:'Fraunces',serif;font-size:44px\">Speakers<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px\">\n<div class=\"card\" style=\"border:2px solid #E8A317\"><div style=\"width:96px;height:96px;background:#E8A317;transform:rotate(45deg);margin:24px 0 24px 24px\" aria-hidden=\"true\"><\u002Fdiv><strong style=\"font-size:20px\">[SPEAKER NAME]<\u002Fstrong><span style=\"color:#CBBFA8\">[Talk title]<\u002Fspan><\u002Fdiv>\n<div class=\"card\" style=\"border:2px solid #E8A317\"><div style=\"width:96px;height:96px;background:#D12A38;transform:rotate(45deg);margin:24px 0 24px 24px\" aria-hidden=\"true\"><\u002Fdiv><strong style=\"font-size:20px\">[SPEAKER NAME]<\u002Fstrong><span style=\"color:#CBBFA8\">[Talk title]<\u002Fspan><\u002Fdiv>\n<div class=\"card\" style=\"border:2px solid #E8A317\"><div style=\"width:96px;height:96px;background:#E8A317;transform:rotate(45deg);margin:24px 0 24px 24px\" aria-hidden=\"true\"><\u002Fdiv><strong style=\"font-size:20px\">[SPEAKER NAME]<\u002Fstrong><span style=\"color:#CBBFA8\">[Talk title]<\u002Fspan><\u002Fdiv>\n<div class=\"card\" style=\"border:2px solid #E8A317\"><div style=\"width:96px;height:96px;background:#D12A38;transform:rotate(45deg);margin:24px 0 24px 24px\" aria-hidden=\"true\"><\u002Fdiv><strong style=\"font-size:20px\">[SPEAKER NAME]<\u002Fstrong><span style=\"color:#CBBFA8\">[Talk title]<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"experience\" style=\"padding:80px 48px\">\n<h2 style=\"margin:0 0 40px;font-family:'Fraunces',serif;font-size:44px;color:#E8A317\">The experience<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px\">\n<div class=\"card\" style=\"background:#F6EEDD;color:#14110F\"><strong style=\"font-size:22px\">Talks<\u002Fstrong><span style=\"line-height:1.6;color:#3A3128\">[Session format and timing]<\u002Fspan><\u002Fdiv>\n<div class=\"card\" style=\"background:#F6EEDD;color:#14110F\"><strong style=\"font-size:22px\">Performances<\u002Fstrong><span style=\"line-height:1.6;color:#3A3128\">[Music, dance, craft]<\u002Fspan><\u002Fdiv>\n<div class=\"card\" style=\"background:#F6EEDD;color:#14110F\"><strong style=\"font-size:22px\">Conversations<\u002Fstrong><span style=\"line-height:1.6;color:#3A3128\">[Networking and breaks]<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"toghu-blue\"><\u002Fdiv>\n<section id=\"sponsors\" style=\"background:#1F1A16;padding:80px 48px\">\n<h2 style=\"margin:0 0 40px;font-family:'Fraunces',serif;font-size:44px\">Sponsors &amp; partners<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px\">\n<div style=\"height:96px;border:2px dashed #8A7A62;display:flex;align-items:center;justify-content:center;color:#CBBFA8\">[LOGO]<\u002Fdiv>\n<div style=\"height:96px;border:2px dashed #8A7A62;display:flex;align-items:center;justify-content:center;color:#CBBFA8\">[LOGO]<\u002Fdiv>\n<div style=\"height:96px;border:2px dashed #8A7A62;display:flex;align-items:center;justify-content:center;color:#CBBFA8\">[LOGO]<\u002Fdiv>\n<div style=\"height:96px;border:2px dashed #8A7A62;display:flex;align-items:center;justify-content:center;color:#CBBFA8\">[LOGO]<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"toghu\"><\u002Fdiv>\n<section id=\"tickets\" style=\"background:#F6EEDD;color:#14110F;padding:80px 48px\">\n<h2 style=\"margin:0 0 12px;font-family:'Fraunces',serif;font-size:44px\">Tickets<\u002Fh2>\n<p style=\"margin:0 0 40px;font-size:18px;color:#3A3128\">No account needed. Your digital ticket with a QR code arrives by email.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px\">\n<div class=\"card\" style=\"background:#14110F;color:#F6EEDD\">\n<strong style=\"font-size:22px\">General ticket<\u002Fstrong><span style=\"font-size:36px;font-weight:800;color:#E8A317\">[PRICE]<\u002Fspan>\n<label for=\"n1\" style=\"font-size:14px\">Full name<\u002Flabel><input id=\"n1\" type=\"text\" style=\"padding:12px;font-size:16px;border:0\">\n<label for=\"e1\" style=\"font-size:14px\">Email<\u002Flabel><input id=\"e1\" type=\"email\" style=\"padding:12px;font-size:16px;border:0\">\n<a class=\"btn\" href=\"#tickets\" style=\"background:#D12A38;border-color:#D12A38;color:#fff;text-align:center\">Pay and get ticket<\u002Fa>\n<\u002Fdiv>\n<div class=\"card\" style=\"background:#14110F;color:#F6EEDD\">\n<strong style=\"font-size:22px\">Sponsor tickets<\u002Fstrong><span style=\"line-height:1.6;color:#CBBFA8\">Pay for any number of tickets. After payment is confirmed you receive unique codes to share.<\u002Fspan>\n<label for=\"q1\" style=\"font-size:14px\">Number of tickets<\u002Flabel><input id=\"q1\" type=\"number\" style=\"padding:12px;font-size:16px;border:0\">\n<a class=\"btn\" href=\"#tickets\" style=\"color:#E8A317;text-align:center\">Sponsor tickets<\u002Fa>\n<\u002Fdiv>\n<div class=\"card\" style=\"background:#14110F;color:#F6EEDD\">\n<strong style=\"font-size:22px\">Have a sponsored code?<\u002Fstrong><span style=\"line-height:1.6;color:#CBBFA8\">Enter your code and details to receive your ticket. Each code works once.<\u002Fspan>\n<label for=\"c1\" style=\"font-size:14px\">Redemption code<\u002Flabel><input id=\"c1\" type=\"text\" style=\"padding:12px;font-size:16px;border:0\">\n<a class=\"btn\" href=\"#tickets\" style=\"color:#E8A317;text-align:center\">Redeem<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"toghu-braid\"><\u002Fdiv>\n<section id=\"faq\" style=\"padding:80px 48px;max-width:900px\">\n<h2 style=\"margin:0 0 32px;font-family:'Fraunces',serif;font-size:44px;color:#E8A317\">FAQ<\u002Fh2>\n<details><summary>How will I receive my ticket?<\u002Fsummary><p style=\"color:#CBBFA8;line-height:1.6\">By email, with a QR code, once payment is confirmed.<\u002Fp><\u002Fdetails>\n<details><summary>How do sponsored tickets work?<\u002Fsummary><p style=\"color:#CBBFA8;line-height:1.6\">Sponsors pay first. Codes unlock only after payment is confirmed.<\u002Fp><\u002Fdetails>\n<details><summary>Can I transfer my ticket?<\u002Fsummary><p style=\"color:#CBBFA8;line-height:1.6\">[POLICY HERE]<\u002Fp><\u002Fdetails>\n<\u002Fsection>\n\n<section id=\"contact\" style=\"background:#1F1A16;padding:64px 48px;display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between\">\n<div style=\"display:flex;flex-direction:column;gap:8px\"><h2 style=\"margin:0;font-family:'Fraunces',serif;font-size:32px\">Contact<\u002Fh2><span style=\"color:#CBBFA8\">[EMAIL] · [PHONE] · [SOCIAL LINKS]<\u002Fspan><\u002Fdiv>\n<div style=\"max-width:420px;color:#CBBFA8;font-size:14px;line-height:1.6\">This independent TEDx event is operated under license from TED.<\u002Fdiv>\n<\u002Fsection>\n<div class=\"toghu\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:3800}}\">\nclass Component extends DCLogic {\nrenderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
